<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMARINA — a coastal open-world game</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a121e; color: #eef3f7;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: fixed; z-index: 5; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
    font-weight: 600;
  }
  .chip {
    background: rgba(8, 16, 26, .62); border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 8px; padding: 6px 10px;
  }
  .bar {
    width: 170px; height: 12px; border-radius: 6px; overflow: hidden;
    background: rgba(8, 16, 26, .7); border: 1px solid rgba(255, 255, 255, .18);
  }
  .bar > div, .bar > span { display: block; height: 100%; width: 100%; border-radius: 6px; }

  #cash { top: 14px; left: 14px; font-size: 22px; color: #7dff9b; }
  #health-wrap { top: 52px; left: 14px; display: flex; align-items: center; gap: 8px; }
  #health-fill { background: #2ecc71; }
  #health-text { font-size: 14px; min-width: 30px; }
  #stars { top: 14px; right: 14px; font-size: 24px; letter-spacing: 3px; color: #8899aa; }
  #respect { top: 52px; right: 14px; font-size: 14px; color: #ffd76a; }
  #radio { top: 86px; right: 14px; font-size: 13px; color: #bcd7ff; }

  #objective {
    top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; opacity: 0; max-width: 520px;
  }
  #objective-title { font-size: 17px; color: #ffd76a; }
  #objective-text { font-size: 14px; font-weight: 500; margin-top: 2px; }
  #job-count { top: 86px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0; }
  #mission-timer {
    top: 120px; left: 50%; transform: translateX(-50%);
    font-size: 22px; color: #ff8a7a; opacity: 0;
  }

  #minimap {
    left: 14px; bottom: 14px; width: 180px; height: 180px;
    border-radius: 10px; border: 2px solid rgba(255, 255, 255, .25);
    background: #16202b;
  }
  #speed { left: 204px; bottom: 20px; font-size: 20px; opacity: 0; }
  #prompt {
    left: 50%; bottom: 92px; transform: translateX(-50%);
    font-size: 15px; opacity: 0;
  }
  #toast {
    left: 50%; bottom: 140px; transform: translateX(-50%);
    font-size: 16px; opacity: 0; color: #ffe9a8;
  }
  #crosshair {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: rgba(255, 255, 255, .9); opacity: 0;
  }
  #weapon-bar {
    right: 14px; bottom: 52px; font-size: 13px; opacity: 0;
  }
  #ammo { right: 14px; bottom: 16px; font-size: 18px; opacity: 0; }
  #nos-row {
    right: 14px; bottom: 96px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #7fd4ff; opacity: 0;
  }
  #nos-row .bar { width: 110px; }
  #nos-fill { background: #38b6ff; width: 0%; }
  #car-health-row {
    right: 14px; bottom: 128px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; opacity: 0;
  }
  #car-health-row .bar { width: 110px; }
  #car-health-fill { background: #2ecc71; }

  #menu {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: linear-gradient(180deg, rgba(6, 12, 22, .42) 0%, rgba(6, 12, 22, .78) 100%);
  }
  #menu-title {
    margin: 0 0 10px; font-size: 64px; letter-spacing: 10px; font-weight: 800;
    color: #ffd76a; text-shadow: 0 3px 0 #b3541e, 0 8px 28px rgba(0, 0, 0, .8);
  }
  #menu-text {
    max-width: 640px; font-size: 16px; line-height: 1.55; color: #e8eef4;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .9); margin: 0 0 22px;
  }
  #menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #menu-buttons button {
    pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 700; color: #101820;
    background: #ffd76a; border: none; border-radius: 10px;
    padding: 12px 26px; box-shadow: 0 4px 0 #b3541e, 0 8px 20px rgba(0, 0, 0, .5);
  }
  #menu-buttons button:hover { background: #ffe08a; }
  #menu-buttons button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b3541e; }
  .foot {
    position: fixed; z-index: 6; bottom: 6px; right: 10px;
    font-size: 11px; color: rgba(255, 255, 255, .45); pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="cash" class="hud chip">$0</div>
<div id="health-wrap" class="hud">
  <div class="bar"><div id="health-fill"></div></div>
  <span id="health-text">100</span>
</div>
<div id="stars" class="hud">☆☆☆☆☆</div>
<div id="respect" class="hud chip">Respect: Rookie</div>
<div id="radio" class="hud chip">Radio: off</div>

<div id="objective" class="hud chip">
  <div id="objective-title"></div>
  <div id="objective-text"></div>
</div>
<div id="job-count" class="hud chip"></div>
<div id="mission-timer" class="hud chip"></div>

<canvas id="minimap" class="hud" width="180" height="180"></canvas>
<div id="speed" class="hud chip">0 km/h</div>
<div id="prompt" class="hud chip"></div>
<div id="toast" class="hud chip"></div>
<div id="crosshair" class="hud">+</div>
<div id="weapon-bar" class="hud chip"></div>
<div id="ammo" class="hud chip"></div>
<div id="nos-row" class="hud chip">NOS <span class="bar"><span id="nos-fill"></span></span></div>
<div id="car-health-row" class="hud chip">Car <span class="bar"><span id="car-health-fill"></span></span></div>

<div id="menu">
  <h1 id="menu-title">SOLMARINA</h1>
  <p id="menu-text">Loading the city…</p>
  <div id="menu-buttons"></div>
</div>
<div class="foot">SOLMARINA — a fan-made open-world game inspired by GTA 6</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
